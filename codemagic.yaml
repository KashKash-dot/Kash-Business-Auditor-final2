workflows:
  kash-business-auditor-android:
    name: Kash Business Auditor Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      node: 22
      java: 17

    scripts:
      - name: Extract project ZIP
        script: |
          set -e

          ZIP_FILE=$(find "$CM_BUILD_DIR" -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p "$CM_BUILD_DIR/kash-source"
          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/kash-source"

          PROJECT_DIR=$(find "$CM_BUILD_DIR/kash-source" -type f -name "package.json" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found after extracting the ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Install dependencies
        script: |
          set -e
          cd "$PROJECT_DIR"
          npm install

      - name: Build web application
        script: |
          set -e
          cd "$PROJECT_DIR"
          npm run build

      - name: Prepare Android project
        script: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Configure Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/android/local.properties"

      - name: Build Android debug APK
        script: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - "**/android/app/build/outputs/apk/debug/*.apk"
