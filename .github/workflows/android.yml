name: Build Kash Business Auditor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android source package
        shell: bash
        run: |
          set -e

          ZIP="Kash-Business-Auditor-final2-source.zip"

          if [ ! -f "$ZIP" ]; then
            echo "Source ZIP not found: $ZIP"
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          echo "Extracted source:"
          find source -maxdepth 4 -type f | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(dirname "$(find source -type f -name settings.gradle -print -quit)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "Could not locate settings.gradle"
            exit 1
          fi

          echo "ANDROID_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          gradle --no-daemon -p "$ANDROID_PROJECT" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kash-Business-Auditor-debug-APK
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
